["ES.PRESET"]
prototype = "ES.PRESET x"
short = "I2C only: recall preset `x` (0-7) on an external Ansible"
description = """
Recall the preset in location `x` on an external Ansible running Earthsea.
Unlike the other `ES.*` ops this is NOT retargeted at the native Earthsea
mode (the native port has a single global bank instead of presets).
"""

["ES.MODE"]
prototype = "ES.MODE x"
short = "Set edge mode (<0 pattern, 0 drone, 1-15 fixed)"
description = """
Sets the current pattern's edge (gate) mode. `x` < 0 or > 15: pattern mode
(gates exactly as recorded). `x` = 0: drone mode (presses toggle notes).
`x` = 1-15: fixed mode with gate length (`x`+1)*16 ms.
"""

["ES.CLOCK"]
prototype = "ES.CLOCK x"
short = "Advance to the next pattern event group"
description = """
Advance playback by one chord group (all events recorded closer together
than the chord threshold play at once). Use with external-clock mode for
stepped playback. `x` is ignored (kept for compatibility).
"""

["ES.RESET"]
prototype = "ES.RESET x"
short = "(Re)start playback at position `x`/16 (0-15)"
description = """
Start (or restart) playback of the current pattern at scrub position `x`/16
of its total length; 0 starts from the beginning.
"""

["ES.PATTERN"]
prototype = "ES.PATTERN x"
short = "Select pattern (0-15)"
description = """
Select pattern (0-15). Does not start playback (use `ES.RESET` / `ES.RUN`).
"""

["ES.TRANS"]
prototype = "ES.TRANS x"
short = "Transpose the current pattern and restart playback"
description = """
Walk the pattern root `x` steps along the fourths keyboard layout (positive =
up in pitch), then restart playback. `x` divided by 5 (integer) shifts the root
up or down a row; `x` modulo 5 shifts left or right up to 4 notes.
"""

["ES.STOP"]
prototype = "ES.STOP x"
short = "Stop pattern playback"
description = """
Stop pattern playback. `x` is ignored (kept for compatibility).
"""

["ES.TRIPLE"]
prototype = "ES.TRIPLE x"
short = "I2C only: recall triple shape (1-4) on an original Earthsea"
description = """
Recall triple shape (1-4). Targets the original Earthsea module over I2C;
not retargeted at the native mode (Ansible ignores it too).
"""

["ES.MAGIC"]
prototype = "ES.MAGIC x"
short = "Magic: 1 half, 2 double, 3/4 linearize on/off, 5/6 fwd/rev"
description = """
Apply a magic transform to the current pattern: 1 = half speed, 2 = double
speed, 3 = linearize on, 4 = linearize off, 5 = play forward, 6 = play
reversed.
"""

["ES.CV"]
prototype = "ES.CV x"
short = "Get the current CV (pitch) value for voice `x` (1-4)"

["ES.RUN"]
prototype = "ES.RUN x"
short = "Play (`x` != 0) or stop + silence (`x` = 0) the current pattern"
description = """
`x` non-zero starts playback of the current pattern from the beginning (it
keeps playing in the background across mode changes). `x` = 0 stops playback
and silences all Earthsea voices, releasing the CV/TR jacks back to scripts.
"""
