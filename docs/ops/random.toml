[RAND]
prototype = "RAND x"
aliases = ["RND"]
short = "generate a random number between `0` and `x` inclusive"

[RRAND]
prototype = "RRAND x y"
aliases = ["RRND"]
short = "generate a random number between `x` and `y` inclusive"

[TOSS]
prototype = "TOSS"
short = "randomly return `0` or `1`"

[R]
prototype = "R"
prototype_set = "R x"
short = "get a random number/set `R.MIN` and `R.MAX` to same value `x` (effectively allowing `R` to be used as a global variable)"

["R.MIN"]
prototype = "R.MIN x"
short = "set the lower end of the range from -32768 – 32767, default: 0"

["R.MAX"]
prototype = "R.MAX x"
short = "set the upper end of the range from -32768 – 32767, default: 16383"

[CHAOS]
prototype = "CHAOS x"
short = "get next value from chaos generator, or set the current value"

["CHAOS.R"]
prototype = "CHAOS.R x"
short = "get or set the `R` parameter for the `CHAOS` generator"

["CHAOS.ALG"]
prototype = "CHAOS.ALG x"
short = "get or set the algorithm for the `CHAOS` generator. 0 = LOGISTIC, 1 = CUBIC, 2 = HENON, 3 = CELLULAR"

[DV]
prototype = "DV max"
short = "advance the déjà vu random sequence one step, returning a value from `0` to `max` inclusive"
description = """
`DV` is a port of the *déjà vu* random-loop engine from Mutable Instruments
Marbles. It maintains a short loop of random values; each read advances the
loop one step and returns the current value scaled to `0`–`max`.

`DV.DV` sets the *déjà vu amount* (`0`–`100`), the balance between novelty and
repetition: `0` plays fresh random values, `50` locks the loop into an exact
repeat, and `100` keeps the loop's values but shuffles their order. `DV.L` sets
the loop length (`1`–`16`) and `DV.R` re-locks a brand-new loop.

By default `DV` values are uniformly distributed. `DV.B` instead shapes each
value through the same bell-with-fat-tails distribution as Marbles' X output
(see `BETA`), so values cluster toward the middle of the range. `DV.K` is the
adjustable-shape variant, warping each value through the same variable
distribution as `BETA.K` (shape set by `a` and `b`).

The déjà vu state is global (shared by all `DV` ops), not per-scene, and resets
on power cycle.
"""

["DV.DV"]
prototype = "DV.DV"
prototype_set = "DV.DV x"
short = "get / set the déjà vu amount `0`–`100`: `0` = fresh random, `50` = locked loop, `100` = shuffled loop"

["DV.L"]
prototype = "DV.L"
prototype_set = "DV.L x"
short = "get / set the déjà vu loop length, `1`–`16` (default `8`)"

["DV.R"]
prototype = "DV.R"
short = "re-lock the déjà vu loop: refill it with fresh random values"

["DV.B"]
prototype = "DV.B max"
short = "like `DV`, but shape the value through the `BETA` distribution before scaling to `0`–`max` (the Marbles X-output character)"

["DV.K"]
prototype = "DV.K a b max"
short = "like `DV`, but shape the value through the variable `BETA.K` distribution (shape set by `a` and `b`) before scaling to `0`–`max`"

[BETA]
prototype = "BETA x"
short = "shape a uniform value `x` (`0`–`16383`) through a fixed beta distribution, returning `0`–`16383`"
description = """
`BETA` warps a uniformly-distributed input into the bell-with-fatter-tails
distribution of Mutable Instruments Marbles' X section (a fixed `beta(3, 3)`
curve). Values are pulled toward the middle of the range while the tails still
reach the extremes, so `BETA RAND 16383` produces centre-weighted randomness.

The shape is fixed — Marbles' table-driven bias and spread controls need 45
lookup tables (~68 KB) and do not fit in the module's flash. `DV.B` applies this
same shaping to the déjà vu sequence; `BETA.K` offers an adjustable-shape
alternative.
"""

["BETA.K"]
prototype = "BETA.K a b x"
short = "shape a uniform value `x` (`0`–`16383`) through a variable beta-like distribution set by `a` and `b`, returning `0`–`16383`"
description = """
`BETA.K` is the adjustable-shape companion to `BETA`. It warps a uniform input
`x` (`0`–`16383`) through a table-free beta-distribution surrogate whose shape is
set by `a` and `b`, given in eighths (so `8` means `1.0`):

- `a = b = 8` — flat (uniform, no shaping).
- `a = b > 8` — bell: mass concentrates toward the middle (larger = tighter).
- `a = b < 8` — bimodal: mass is pushed out toward both rails.
- `a ≠ b` — skewed: the two sides are shaped independently, biasing the result
  low or high.

When `a` equals `b` the distribution is exactly symmetric and centred. This
approximates Marbles' spread/bias controls without the 45 lookup tables the
faithful shaper would need; it is computed at read time (one power function, no
table) at a small accuracy cost that is inaudible for randomness.
"""

[DRUNK]
prototype = "DRUNK"
prototype_set = "DRUNK x"
short = """changes by `-1`, `0`, or `1` upon each read saving its state,
setting will give it a new value for the next read"""
description="""
Changes by `-1`, `0`, or `1` upon each read, saving its state. Setting `DRUNK`
will give it a new value for the next read, and drunkenness will continue on
from there with subsequent reads.

Setting `DRUNK.MIN` and `DRUNK.MAX` controls the lower and upper bounds
(inclusive) that `DRUNK` can reach. `DRUNK.WRAP` controls whether the value can
wrap around when it reaches its bounds.
"""

["DRUNK.MIN"]
prototype = "DRUNK.MIN"
prototype_set = "DRUNK.MIN x"
short = "set the lower bound for `DRUNK`, default `0`"

["DRUNK.MAX"]
prototype = "DRUNK.MAX"
prototype_set = "DRUNK.MAX x"
short = "set the upper bound for `DRUNK`, default `255`"

["DRUNK.WRAP"]
prototype = "DRUNK.WRAP"
prototype_set = "DRUNK.WRAP x"
short = "should `DRUNK` wrap around when it reaches its bounds, default `0`"

