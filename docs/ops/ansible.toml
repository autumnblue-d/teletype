["KR.POS"]
prototype = "KR.POS x y"
prototype_set = "KR.POS x y z"
short = "get/set the play position for track `x`, parameter `y` (set to `z`)"
description = """
Get or set the current step position for track `x` (0-3), parameter `y`.

Parameters:

 - `0` = trigger
 - `1` = note
 - `2` = octave
 - `3` = duration
 - `4` = repeat
 - `5` = alt note
 - `6` = glide
"""

