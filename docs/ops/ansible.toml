["KR.L.LEN"]
prototype = "KR.L.LEN x y"
prototype_set = "KR.L.LEN x y z"
short = "get/set loop length for track `x`, parameter `y` (set to `z`, 1-16)"

["KR.TMUL"]
prototype = "KR.TMUL x y"
prototype_set = "KR.TMUL x y z"
short = "get/set the clock divider for track `x` (0-3), parameter `y` (0-6), set to `z` (1-16)"
description = """
Get or set the per-parameter clock divider (the grid TIME page) for track `x`
(0-3) and parameter `y` (same indices as `KR.POS`: 0 trigger, 1 note, 2 octave,
3 duration, 4 repeat, 5 alt note, 6 glide). `z` is the divider (1-16): that
parameter advances once every `z` clocks, so different parameters/tracks drift
into polymeter. Takes effect on the next clock; persisted with the song.
"""

["KR.RES"]
prototype = "KR.RES x y"
short = "reset Kria playback to loop start: `x` = 0 all tracks, `1`-`4` that track (1-indexed). `y` is ignored (kept for arg-count compatibility)"
description = """
Reset Kria playback to the loop start. `x` selects the target, matching the
`MP.RESET` / `ME.RES` / `CY.RES` convention:

 - `0` = all tracks (also clears the song clock/cue/meta counters)
 - `1`-`4` = re-arm just that track (1-indexed), leaving the song counters intact

`y` is ignored; it is accepted only so existing two-argument `KR.RES x y` scripts
still parse.
"""

