["MO.CH"]
prototype = "MO.CH"
prototype_set = "MO.CH x"
short = "get or set the default MIDI out channel (1..16)"
description = """
All MIDI out ops use the default channel except the `#` ops, which take an explicit channel.
The default channel is a module-level setting and is not saved per scene.
"""

["MO.PORT"]
prototype = "MO.PORT"
prototype_set = "MO.PORT x"
short = "get or set the default output port / USB virtual cable (0=A, 1=B on a multi-port interface)"
description = """
All MIDI out ops send on the selected port. The default port is a module-level setting and is not saved per scene.
On the M-Audio MIDISPORT 2x2, port 0 is DIN out A and port 1 is DIN out B.
"""

["MO.N"]
prototype = "MO.N x y"
short = "send MIDI Note On message for note `x` (0..127) and velocity `y` (0..127)"

["MO.N#"]
prototype = "MO.N# x y z"
short = "send MIDI Note On message on channel `x` for note `y` (0..127) and velocity `z` (0..127)"

["MO.NO"]
prototype = "MO.NO x"
short = "send MIDI Note Off message for note `x` (0..127)"

["MO.NO#"]
prototype = "MO.NO# x y"
short = "send MIDI Note Off message on channel `x` for note `y` (0..127)"

["MO.NG"]
prototype = "MO.NG x y z"
short = "send MIDI Note On for note `x` (0..127) at velocity `y` (0..127), then an automatic Note Off after `z` milliseconds (quantised to the 10ms tick)"

["MO.NG#"]
prototype = "MO.NG# w x y z"
short = "as `MO.NG` on channel `w` for note `x` at velocity `y`, with the Note Off after `z` milliseconds"

["MO.TR"]
prototype = "MO.TR x y"
short = "send a MIDI note trigger for note `x` (0..127) at velocity `y` (0..127): Note On now, automatic Note Off after the `MO.TR.TIME` gate (20ms by default), for percussive/one-shot voices"

["MO.TR#"]
prototype = "MO.TR# w x y"
short = "as `MO.TR` on channel `w` for note `x` at velocity `y`"

["MO.TR.TIME"]
prototype = "MO.TR.TIME x"
short = "get/set the gate length in milliseconds used by `MO.TR`/`MO.TR#` (default 20, quantised to the 10ms tick)"

["MO.NALL"]
prototype = "MO.NALL"
short = "immediately send Note Off for every note still held by `MO.NG`/`MO.TR` (panic); also happens automatically on scene load"

["MO.CC"]
prototype = "MO.CC x y"
short = "send MIDI CC message for controller `x` (0..127) and value `y` (0..127)"

["MO.CC#"]
prototype = "MO.CC# x y z"
short = "send MIDI CC message on channel `x` for controller `y` (0..127) and value `z` (0..127)"

["MO.PB"]
prototype = "MO.PB x"
short = "send MIDI Pitch Bend message (14-bit value `x`)"

["MO.PRG"]
prototype = "MO.PRG x"
short = "send MIDI Program Change message for program `x` (0..127)"

["MO.CLK"]
prototype = "MO.CLK"
short = "send MIDI Timing Clock message"

["MO.START"]
prototype = "MO.START"
short = "send MIDI Start message"

["MO.STOP"]
prototype = "MO.STOP"
short = "send MIDI Stop message"

["MO.CONT"]
prototype = "MO.CONT"
short = "send MIDI Continue message"

["MO.AT"]
prototype = "MO.AT x"
short = "send MIDI Channel Pressure (aftertouch) `x` (0..127) on the default channel"

["MO.PANIC"]
prototype = "MO.PANIC"
short = "kill all sound: send All Sound Off (CC 120) + All Notes Off (CC 123) on all 16 channels and release every note held by MO.NG/MO.TR"

["MO.SPP"]
prototype = "MO.SPP x"
short = "send MIDI Song Position Pointer `x` (0..16383, in 16th-note beats); pairs with MO.CLK/START/STOP/CONT to drive a DAW's transport"
